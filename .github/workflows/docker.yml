name: Docker-Image

# Baut bei jedem Push auf master das Image und schiebt es nach ghcr.io (latest + Version aus package.json).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gleiche Optionen wie der Build-Befehl in der README: amd64 für Unraid, keine Attestations,
      # klassisches Docker-Manifest (sonst meldet der Unraid-Update-Check "not available").
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: VERSION=${{ steps.meta.outputs.version }}
          outputs: type=registry,oci-mediatypes=false
          tags: |
            ghcr.io/gottschalkfelix4-source/media-agentcy:latest
            ghcr.io/gottschalkfelix4-source/media-agentcy:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
